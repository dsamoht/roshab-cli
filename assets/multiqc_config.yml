report_comment: >
  This report has been generated by the <a href="https://github.com/dsamoht/roshab-cli" target="_blank">dsamoht/roshab-cli</a>
  analysis pipeline.

report_section_order:
  "dsamoht-roshab-cli-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "dsamoht-roshab-cli-summary":
    order: -1002

report_header_info:
  - Application: "roshab-cli"

export_plots: true
disable_version_detection: true

show_analysis_paths: False
show_analysis_time: False

skip_generalstats: true

top_modules:
  - nanostat
  - kraken

kraken:
  top_n: 10

custom_plot_config:
  nanostat_quality_dist:
    cpswitch_c_active: False
  kraken-top-n-plot:
    cpswitch_c_active: False

# The pipeline names the Kraken2/Bracken reports `*.kraken` and
# `*.bracken.report`, which are not among the MultiQC defaults.
sp:
  kraken:
    fn: "*.bracken.report"
