---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: cat_reads
description: Concatenate FastQ files and optionally stamp the sample name onto read IDs
keywords:
  - concatenate
  - fastq
  - merge
  - nanopore
tools:
  - python:
      description: |
        Python is a programming language that lets you work quickly and integrate
        systems more effectively.
      homepage: https://www.python.org
      documentation: https://www.python.org
      licence: ["PSF-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', group:'lake', info:'site1', date:'20260312' ]`
    - reads:
        type: file
        description: FastQ files or directories of FastQ files to concatenate
        pattern: "*.{fastq,fq}{,.gz}"
        ontologies: []
    - read_id_prefix:
        type: string
        description: Prefix prepended to every read ID, or an empty string to leave IDs untouched
output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', group:'lake', info:'site1', date:'20260312' ]`
      - "*.fastq.gz":
          type: file
          description: Concatenated reads
          pattern: "*.fastq.gz"
          ontologies: []
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - "python --version | sed 's/^Python //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
