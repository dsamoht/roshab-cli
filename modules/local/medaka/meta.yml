---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: medaka
description: Polish an assembly with the reads it was built from
keywords:
  - polishing
  - consensus
  - nanopore
  - assembly
  - medaka
tools:
  - medaka:
      description: |
        Neural-network based consensus and variant calling for Oxford Nanopore
        Technologies sequencing data.
      homepage: https://github.com/nanoporetech/medaka
      documentation: https://github.com/nanoporetech/medaka
      licence: ["Oxford Nanopore Technologies PLC. Public License Version 1.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', group:'lake', info:'site1', date:'20260312' ]`
    - reads:
        type: file
        description: Nanopore reads used for the assembly
        pattern: "*.{fastq,fq}{,.gz}"
        ontologies: []
    - contigs:
        type: file
        description: Draft assembly to polish
        pattern: "*.fasta"
        ontologies: []
output:
  contigs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', group:'lake', info:'site1', date:'20260312' ]`
      - "*.polished.fasta":
          type: file
          description: Polished assembly
          pattern: "*.polished.fasta"
          ontologies: []
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - medaka:
          type: string
          description: The tool name
      - "medaka --version | sed 's/^medaka //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
