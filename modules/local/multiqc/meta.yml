---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: multiqc
description: Aggregate results from bioinformatics analyses across many samples
  into a single report
keywords:
  - qc
  - bioinformatics tools
  - report
tools:
  - multiqc:
      description: |
        MultiQC searches a given directory for analysis logs and compiles a HTML report.
        It's a general use tool, perfect for summarising the output from numerous bioinformatics tools.
      homepage: https://multiqc.info/
      documentation: https://multiqc.info/docs/
      doi: 10.1093/bioinformatics/btw354
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:multiqc
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing report information
          e.g. `[ id:'roshab-cli' ]`
    - multiqc_files:
        type: file
        description: |
          List of reports / files recognised by MultiQC, for example the NanoStats
          summaries and the Bracken reports produced by the pipeline
        ontologies: []
  - - multiqc_config:
        type: file
        description: Config yml for MultiQC
        pattern: "*.{yml,yaml}"
        ontologies:
          - edam: http://edamontology.org/format_3750
  - - multiqc_logo:
        type: file
        description: Optional logo file for MultiQC
        pattern: "*.{png}"
        ontologies: []
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing report information
            e.g. `[ id:'roshab-cli' ]`
      - "*.html":
          type: file
          description: MultiQC report file
          pattern: "*.html"
          ontologies: []
  data:
    - - meta:
          type: map
          description: |
            Groovy Map containing report information
            e.g. `[ id:'roshab-cli' ]`
      - "*_data":
          type: directory
          description: MultiQC data dir
          pattern: "multiqc_data"
  plots:
    - - meta:
          type: map
          description: |
            Groovy Map containing report information
            e.g. `[ id:'roshab-cli' ]`
      - "*_plots":
          type: file
          description: Plots created by MultiQC
          pattern: "*_plots"
          ontologies: []
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - multiqc:
          type: string
          description: The tool name
      - "multiqc --version | sed 's/.* //g'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
