---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: plot_gene_diamond
description: Plot a cyanotoxin gene heatmap across the samples of a group
keywords:
  - visualisation
  - heatmap
  - diamond
  - cyanotoxin
  - figure
tools:
  - python:
      description: |
        Python is a programming language that lets you work quickly and integrate
        systems more effectively.
      homepage: https://www.python.org
      documentation: https://www.python.org
      licence: ["PSF-2.0"]
      identifier: ""
input:
  - - group_id:
        type: string
        description: Group identifier
    - diamond_tsvs:
        type: file
        description: DIAMOND tabular alignments for every sample of the group
        pattern: "*.tsv"
        ontologies: []
  - - genes_db:
        type: file
        description: The cyanotoxin gene FASTA the alignments were made against
        pattern: "*.{fa,faa,fasta}"
        ontologies: []
output:
  pdf:
    - - group_id:
          type: string
          description: Group identifier
      - "*_heatmap.pdf":
          type: file
          description: Cyanotoxin gene heatmap
          pattern: "*_heatmap.pdf"
          ontologies: []
  tsv:
    - - group_id:
          type: string
          description: Group identifier
      - "*_evidence.tsv":
          type: file
          description: Per-gene evidence table, including read co-location statistics
          pattern: "*_evidence.tsv"
          ontologies: []
  multigene_pdf:
    - - group_id:
          type: string
          description: Group identifier
      - "*_multigene_reads.pdf":
          type: file
          description: Bar chart of reads carrying more than one gene of the same toxin
          pattern: "*_multigene_reads.pdf"
          ontologies: []
  multigene_tsv:
    - - group_id:
          type: string
          description: Group identifier
      - "*_multigene_reads.tsv":
          type: file
          description: One row per read carrying more than one gene of the same toxin
          pattern: "*_multigene_reads.tsv"
          ontologies: []
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - "python --version | sed 's/^Python //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
