---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: nanoplot
description: Plot quality metrics for Oxford Nanopore reads
keywords:
  - nanopore
  - long reads
  - quality control
  - qc
  - visualisation
tools:
  - nanoplot:
      description: |
        Plotting tool for long read sequencing data and alignments.
      homepage: https://github.com/wdecoster/NanoPlot
      documentation: https://github.com/wdecoster/NanoPlot
      doi: 10.1093/bioinformatics/bty149
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', group:'lake', info:'site1', date:'20260312' ]`
    - fastq:
        type: file
        description: Nanopore reads in FastQ format
        pattern: "*.{fastq,fq}{,.gz}"
        ontologies: []
output:
  html:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', group:'lake', info:'site1', date:'20260312' ]`
      - "*.html":
          type: file
          description: NanoPlot HTML report
          pattern: "*.html"
          ontologies: []
  png:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', group:'lake', info:'site1', date:'20260312' ]`
      - "*.png":
          type: file
          description: NanoPlot figures
          pattern: "*.png"
          ontologies: []
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', group:'lake', info:'site1', date:'20260312' ]`
      - "*.txt":
          type: file
          description: NanoStats summary statistics, read by MultiQC
          pattern: "*.txt"
          ontologies: []
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - nanoplot:
          type: string
          description: The tool name
      - "NanoPlot --version | sed 's/^NanoPlot //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
